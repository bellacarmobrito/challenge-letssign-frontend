<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LetsSign | É simples assinar!</title>
    <link rel="icon" href="../assets/favicon.ico" type="image/x-icon" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="../css/styles.css" />

    <link rel="stylesheet" href="../css/reconhecimento-visual.css" />
  </head>
  <body>
    <div class="container-fluid p-0">
      <header class="py-3 px-5 d-flex justify-content-between shadow bg-white">
        <img
          src="../assets/letssign.png"
          alt="LetsSign"
          class="d-block header-logo"
        />
        <div class="d-flex align-items-center">
          <span
            class="text-end fw-semibold shield-icon"
            style="color: #959594; font-size: 15px"
            >Ambiente seguro LetsSign</span
          >
          <img
            src="../assets/shield.svg"
            alt=""
            style="width: 22px; margin-left: 25px"
            class="shield-icon"
          />
        </div>
      </header>

      <div class="d-flex">
        <aside class="sidebar">
          <div class="menu-item" style="pointer-events: none">
            <div class="menu-icon" style="pointer-events: none"></div>
            <div class="menu-text" style="pointer-events: none">
              <a href="#"></a>
            </div>
          </div>

          <div class="menu-item">
            <div class="menu-icon">
              <img src="../assets/feather.svg" alt="Ícone" />
            </div>
            <div class="menu-text">
              <a href="#">Assinar como cliente</a>
            </div>
          </div>

          <div class="menu-item">
            <div class="menu-icon">
              <img src="../assets/cloud.svg" alt="Ícone" />
            </div>
            <div class="menu-text">
              <a href="#">Baixar documento</a>
            </div>
          </div>

          <div class="menu-item">
            <div class="menu-icon">
              <img src="../assets/edit.svg" alt="Ícone" />
            </div>
            <div class="menu-text">
              <a href="#">0/1 Assinaturas</a>
            </div>
          </div>

          <div class="menu-item sign" style="pointer-events: none">
            <div class="menu-icon"></div>
            <div class="menu-text client" style="pointer-events: none">
              <span style="pointer-events: none">pamela.souza@gmail.com</span>
              <a href="#" style="pointer-events: none">Assine como ciente</a>
              <div class="sidebar-logo">
                <img src="../assets/letssign_white.png" alt="" />
              </div>
            </div>
          </div>
        </aside>

        <main class="flex-grow-1 p-4 d-flex justify-content-center">
            <div class="content-container shadow rounded-4 p-4 h-100 d-flex justify-content-center text-white flex-column align-items-center reconhecimento-container">
                <h1 class="titulo-camera fw-bold">Centralize o seu dedo</h1>
                <div class="bg-white rounded-4 d-flex justify-content-center align-items-center overflow-hidden" id="camera-container">
                    <video id="video" autoplay playsinline class="w-100 h-100 object-fit-cover"></video>
                    <canvas id="canvas" class="d-none"></canvas>
                    <img src="../assets/icone-digital-azul.svg" id="quadrante-digital" alt="quadrante para posicionamento da digital" class="position-absolute" />
                </div>
                <div class="w-75 d-flex justify-content-center mb-4 mt-5">
                    <h2 class="texto-inferior">Por favor, aguarde enquanto identificamos a sua digital.</h1>
                </div>
            </div>
        </main>
      </div>
    </div>

    <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
    ></script>
    <script src="../js/reconhecimento-visual.js"></script>
  </body>
</html>
