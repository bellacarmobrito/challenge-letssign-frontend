<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LetsSign | É simples assinar!</title>
    <link rel="icon" href="../assets/favicon.ico" type="image/x-icon" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="container-fluid p-0">
      <header class="py-3 px-5 d-flex align-items-center shadow bg-white">
        <img
          src="../assets/letssign.png"
          alt="LetsSign"
          class="d-block header-logo"
        />
        <div class="d-flex align-items-center gap-2 ms-auto">
          <div class="dropdown">
            <button
              class="btn btn-secondary dropdown-toggle send-document"
              type="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              Enviar documento
            </button>
            <ul class="dropdown-menu border-0 px-2 shadow-sm">
              <li class="d-flex align-items-center">
                <i class="bi bi-clipboard2-fill"></i>
                <a
                  class="dropdown-item"
                  href="#"
                  role="button"
                  style="font-size: 13px"
                  >Modelos</a
                >
              </li>
              <li class="d-flex align-items-center">
                <i class="bi bi-pen-fill" fill="black"></i>
                <a
                  class="dropdown-item"
                  href="#"
                  role="button"
                  style="font-size: 13px"
                  >Documentos aguardando minha assinatura</a
                >
              </li>
              <li class="d-flex align-items-center">
                <i class="bi bi-people-fill"></i>
                <a
                  class="dropdown-item"
                  href="#"
                  role="button"
                  style="font-size: 13px"
                  >Documentos aguardando assinatura de terceiros</a
                >
              </li>
            </ul>
          </div>

          <button type="button" class="earn-money">Indique e Ganhe $</button>
        </div>

        <div class="dropdown ps-4 shield-icon">
          <button
            class="btn dropdown-toggle custom-dropdown"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
            style="background-color: none; border: none"
          >
            <img
              src="../assets/default-avatar.png"
              alt=""
              style="
                width: 36px;
                border: 2px solid #edf0f0;
                border-radius: 100%;
              "
            />
            <i
              class="bi bi-chevron-down"
              style="
                width: 9px;
                margin-left: 7px;
                margin-top: -2px;
                color: lightgray;
              "
            ></i>
          </button>
          <ul class="dropdown-menu border-0 px-2 shadow-sm">
            <li class="d-flex align-items-center">
              <i class="bi bi-currency-dollar"></i>
              <a class="dropdown-item" href="#" style="font-size: 13px"
                >Indique e Ganhe</a
              >
            </li>
            <li class="d-flex align-items-center">
              <i class="bi bi-person-vcard-fill"></i>
              <a class="dropdown-item" href="#" style="font-size: 13px"
                >Ver perfil</a
              >
            </li>
            <li class="d-flex align-items-center">
              <i class="bi bi-lock-fill"></i>
              <a class="dropdown-item" href="#" style="font-size: 13px"
                >Alterar Senha</a
              >
            </li>
            <li class="d-flex align-items-center">
              <i class="bi bi-power"></i>
              <a class="dropdown-item" href="#" style="font-size: 13px">Sair</a>
            </li>
          </ul>
        </div>
      </header>

      <div class="d-flex">
        <aside class="sidebar">
          <div class="menu-item" style="pointer-events: none">
            <div class="menu-icon" style="pointer-events: none"></div>
            <div class="menu-text" style="pointer-events: none">
              <a href="#"></a>
            </div>
          </div>

          <div class="menu-item">
            <div class="menu-icon">
              <img
                src="../assets/Caminho 667.svg"
                alt="Ícone"
                style="padding: 2px"
              />
            </div>
            <div class="menu-text">
              <a href="#">Acesso rápido</a>
            </div>
          </div>

          <div class="menu-item">
            <div class="menu-icon">
              <img
                src="../assets/ic-actions-file.svg"
                alt="Ícone"
                style="padding: 2px"
              />
            </div>
            <div class="menu-text">
              <a href="#">Documentos</a>
            </div>
          </div>

          <div class="menu-item">
            <div class="menu-icon">
              <img src="../assets/Vector.svg" alt="Ícone" style="padding: 2px" />
            </div>
            <div class="menu-text">
              <a href="#">Modelos</a>
            </div>
          </div>

          <div class="menu-item">
            <div class="menu-icon">
              <img
                src="../assets/ic-actions-list-users.svg"
                alt="Ícone"
                style="padding: 2px"
              />
            </div>
            <div class="menu-text">
              <a href="#">Contatos</a>
            </div>
          </div>

          <div class="menu-item">
            <div class="menu-icon">
              <img
                src="../assets/ic-statistics-workflow.svg"
                alt="Ícone"
                style="padding: 2px"
              />
            </div>
            <div class="menu-text">
              <a href="#">Integrações</a>
            </div>
          </div>

          <div class="menu-item">
            <div class="menu-icon">
              <img
                src="../assets/ic-actions-settings.svg"
                alt="Ícone"
                style="padding: 2px"
              />
            </div>
            <div class="menu-text">
              <a href="#">Preferências</a>
            </div>
          </div>

          <div class="menu-item">
            <div class="menu-icon">
              <img src="../assets/headset.svg" alt="Ícone" style="padding: 2px" />
            </div>
            <div class="menu-text">
              <a href="#">Ajuda</a>
            </div>
          </div>

          <div class="menu-item sign" style="pointer-events: none">
            <div class="menu-icon"></div>
            <div class="menu-text client" style="pointer-events: none">
              <div class="sidebar-logo">
                <img src="../assets/letssign_white.png" alt="" />
              </div>
            </div>
          </div>
        </aside>

        <main>
          <!-- CONTEÚDO AQUI -->
        </main>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
