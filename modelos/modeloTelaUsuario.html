<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LetsSign | É simples assinar!</title>
    <link rel="icon" href="../assets/favicon.ico" type="image/x-icon" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />

    <link

      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"

    />

    <link

    <link rel="stylesheet" href="../css/styles.css" />

  <body>
    <div class="container-fluid p-0">
      <div class="py-3 px-5 d-flex justify-content-between shadow bg-white">
        <img
          src="../assets/letssign.png"
          alt="LetsSign"
          class="d-block"
          style="width: 160px"
        />
        <div class="d-flex align-items-center">
          <span
            class="text-end fw-semibold"
            style="color: #959594; font-size: 15px"
            >Ambiente seguro LetsSign</span
          >
          <img src="../assets/shield.svg" alt="" style="margin-left: 25px" />
        </div>
      </div>

      <div class="sidebar">
        <div class="menu-item" style="pointer-events: none">
          <div class="menu-icon" style="pointer-events: none"></div>
          <div class="menu-text" style="pointer-events: none">
            <a href="#"></a>
          </div>
        </div>

        <div class="menu-item">
          <div class="menu-icon">
            <img src="../assets/feather.svg" alt="Ícone" />
          </div>
          <div class="menu-text">
            <a href="#">Assinar como cliente</a>
          </div>
        </div>

        <div class="menu-item">
          <div class="menu-icon">
            <img src="../assets/cloud.svg" alt="Ícone" />
          </div>
          <div class="menu-text">
            <a href="#">Baixar documento</a>
          </div>
        </div>

        <div class="menu-item">
          <div class="menu-icon">
            <img src="../assets/edit.svg" alt="Ícone" />
          </div>
          <div class="menu-text">
            <a href="#">0/1 Assinaturas</a>
          </div>
        </div>

        <div class="menu-item sign" style="pointer-events: none">
          <div class="menu-icon"></div>
          <div class="menu-text client" style="pointer-events: none">
            <span style="pointer-events: none">pamela.souza@gmail.com</span>
            <a href="#" style="pointer-events: none">Assine como ciente</a>
            <div class="sidebar-logo">
              <img src="../assets/letssign_white.png" alt="" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

</html>
